[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
moon-core = { version = "=0.1.0", path = "crates/moon-core" }
moon-win = { version = "=0.1.0", path = "crates/moon-win" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
# The window manager is latency-sensitive even while developing.
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "debuginfo"
