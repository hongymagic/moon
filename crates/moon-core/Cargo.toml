[package]
name = "moon-core"
description = "moon's OS-independent core: world, layout, commands, config, scenes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regex = "=1.13.1"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
taffy = { version = "=0.15.1", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
toml = "=1.2.1"
toml_edit = "=0.25.19"

[dev-dependencies]
insta = "=1.49.0"
proptest = "=1.12.0"

[target.'cfg(not(windows))'.dev-dependencies]
criterion = "=0.8.2"

[[bench]]
name = "reducer"
harness = false
