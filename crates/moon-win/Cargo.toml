[package]
name = "moon-win"
description = "moon's Win32 layer: the only crate that talks to Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
moon-core.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_Common", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_System_Performance_HardwareCounterProfiling", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_Globalization", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_DirectComposition", "Win32_Media_Audio_Endpoints", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Media_Control", "UI_ViewManagement", "Foundation", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_Networking_WinHttp"] }

windows-numerics = "=0.3.1"
windows-future = "=0.3.2"
