name: Release
on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    # Keep every waiting merge. Default group behavior replaces the pending run.
    concurrency:
      group: moon-main-release
      queue: max
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Select release version
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(bun scripts/release-version.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # GraphQL declares its own variables.
          state=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f tag="$version" \
            -f query='query($owner:String!, $name:String!, $tag:String!) { repository(owner:$owner, name:$name) { release(tagName:$tag) { isDraft tagCommit { oid } } } }' \
            --jq '.data.repository.release | if . == null then "new" elif .tagCommit.oid != env.GITHUB_SHA then error("Release belongs to a different commit") elif .isDraft then "draft" else "published" end')
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Authenticate the release publisher
        if: steps.plan.outputs.state != 'published' && vars.MOON_SIGNING_ACCOUNT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install the publisher signing client
        if: steps.plan.outputs.state != 'published' && vars.MOON_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: Install-PSResource ArtifactSigning -Version 0.1.22 -Repository PSGallery -Scope CurrentUser -TrustRepository
      - name: Build and verify both Windows distributions
        if: steps.plan.outputs.state != 'published'
        shell: powershell
        env:
          MOON_RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          MOON_SIGNING_ACCOUNT: ${{ vars.MOON_SIGNING_ACCOUNT }}
          MOON_SIGNING_ENDPOINT: ${{ vars.MOON_SIGNING_ENDPOINT }}
          MOON_SIGNING_PROFILE: ${{ vars.MOON_SIGNING_PROFILE }}
        run: |
          $rustNotices = Join-Path (rustc --print sysroot) 'share/doc/rust/COPYRIGHT-library.html'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $compiler = .\scripts\get-inno-setup.ps1 -Directory "$env:RUNNER_TEMP\moon-inno"
          # The runner's Visual Studio installation includes both MSVC toolsets.
          foreach ($target in 'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc') {
            $build = "$PWD\target\$target\release"
            cargo build --locked --release --target $target -p moon -p moon-settings
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $user = .\scripts\build-user-setup.ps1 -Compiler $compiler -Binary "$build\moon.exe" -SettingsBinary "$build\moon-settings.exe" -RustLibraryNotices $rustNotices -Target $target -Version $env:MOON_RELEASE_VERSION -OutputDirectory "$PWD\dist" -Sign:([bool]$env:MOON_SIGNING_ACCOUNT)
            if ($target -eq 'x86_64-pc-windows-msvc') {
              .\scripts\validate-user-setup.ps1 -Installer $user.installer -Binary "$build\moon.exe" -SettingsBinary "$build\moon-settings.exe" -Signed:([bool]$env:MOON_SIGNING_ACCOUNT)
            }
            cargo build --locked --release --target $target -p moon -p moon-settings --features moon/uiaccess
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cargo build --locked --release --target $target -p moon-win --example window_inventory --example recover_windows
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $inputs = @{
              Target = $target
              Version = $env:MOON_RELEASE_VERSION
              OutputDirectory = "$PWD\dist"
              RustLibraryNotices = $rustNotices
              Binary = "$build\moon.exe"
              SettingsBinary = "$build\moon-settings.exe"
              InventoryBinary = "$build\examples\window_inventory.exe"
              RecoveryBinary = "$build\examples\recover_windows.exe"
            }
            $package = .\scripts\package.ps1 @inputs
            .\scripts\validate-setup-exe.ps1 -InstallerPath $package.installer -ArchivePath $package.archive -Version $package.version -Target $package.target
          }
      - name: Publish verified release assets
        if: steps.plan.outputs.state != 'published'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_STATE: ${{ steps.plan.outputs.state }}
        run: |
          set -euo pipefail
          cd dist
          files=()
          for arch in x64 arm64; do
            name="moon-$VERSION-windows-$arch"
            sha256sum --check "$name-setup.exe.sha256" "$name-uiaccess.exe.sha256" "$name.zip.sha256"
            files+=("$name-setup.exe" "$name-setup.exe.sha256" "$name-uiaccess.exe" "$name-uiaccess.exe.sha256" "$name.zip" "$name.zip.sha256" "$name.manifest.json")
            for suffix in -setup.exe .zip; do
              alias="moon-windows-$arch$suffix"
              cp -- "$name$suffix" "$alias"
              read -r digest _ < "$name$suffix.sha256"
              printf '%s *%s\n' "$digest" "$alias" > "$alias.sha256"
              sha256sum --check "$alias.sha256"
              files+=("$alias" "$alias.sha256")
            done
          done
          sha256sum --binary "${files[@]}" | sort > expected.sha256

          ref="refs/tags/$VERSION"
          if ! git show-ref --verify --quiet "$ref"; then
            # Create-only reservation after verification. A competing tag fails closed.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" --silent
          fi
          # Check the remote object itself before touching draft assets.
          # shellcheck disable=SC2016
          remote_sha=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f rev="$ref^{commit}" \
            -f query='query($owner:String!, $name:String!, $rev:String!) { repository(owner:$owner, name:$name) { object(expression:$rev) { oid } } }' \
            --jq '.data.repository.object.oid')
          [[ "$remote_sha" == "$GITHUB_SHA" ]]
          if [[ "$RELEASE_STATE" == new ]]; then
            gh release create "$VERSION" --draft --verify-tag --target "$GITHUB_SHA" --title "Moon $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" "${files[@]}" --clobber
          gh release view "$VERSION" --json assets --jq '.assets[] | "\(.digest | ltrimstr("sha256:")) *\(.name)"' | sort > uploaded.sha256
          diff -u expected.sha256 uploaded.sha256

          # A slower CI run may publish an older merge after its descendant.
          # shellcheck disable=SC2016
          latest=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner:String!, $name:String!) { repository(owner:$owner, name:$name) { latestRelease { tagCommit { oid } } } }' \
            --jq '.data.repository.latestRelease.tagCommit.oid // empty')
          promote=true
          if [[ -n "$latest" ]] && git merge-base --is-ancestor "$GITHUB_SHA" "$latest"; then promote=false; fi
          gh release edit "$VERSION" --draft=false --latest="$promote"
      - name: Verify the four live website downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for delay in 0 5 15 30; do
            sleep "$delay"
            if gh release view --json tagName,assets | bun scripts/verify-website-downloads.ts; then exit 0; fi
          done
          exit 1
