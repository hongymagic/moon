name: Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

# Each main push must finish its own checks and release. Superseded PR runs may stop.
concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: apps/settings/package.json
      - name: Test release version allocation and download routing
        run: bun test ./scripts/release-version.test.ts ./apps/website/tests/download.test.ts
      - run: bun install --frozen-lockfile
        working-directory: apps/settings
      - run: bun run check && bun run build
        working-directory: apps/settings
      - name: Verify the bundled Settings assets
        run: |
          git diff --exit-code -- apps/settings/dist
          test -z "$(git ls-files --others --exclude-standard -- apps/settings/dist)"
      - run: bunx playwright install --with-deps chromium --only-shell && bun run test
        working-directory: apps/settings
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-test-results
          path: |
            target/settings-browser-results.json
            target/settings-browser-tests/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generated reference matches the current schema
        run: |
          cargo run --locked -q -p moon -- config schema > docs/config.schema.json
          cargo run --locked -q -p moon -- config reference > docs/config-reference.md
          cargo run --locked -q -p moon -- protocol schema > docs/protocol.schema.json
          git diff --exit-code -- docs/config.schema.json docs/config-reference.md docs/protocol.schema.json
      - run: cargo bench -p moon-core --bench reducer --locked
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified dependency checkers
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/cargo-deny-0.21.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL --retry 3 -o audit.tar.gz https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-musl-v0.23.0.tgz
          echo 'a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903  deny.tar.gz' | sha256sum --check
          echo '4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811  audit.tar.gz' | sha256sum --check
          mkdir -p moon-tools
          tar -xzf deny.tar.gz -C moon-tools --strip-components=1 --wildcards '*/cargo-deny'
          tar -xzf audit.tar.gz -C moon-tools --strip-components=1 --wildcards '*/cargo-audit'
          echo "$RUNNER_TEMP/moon-tools" >> "$GITHUB_PATH"
      - run: cargo deny check
      - run: cargo audit
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      WINDOWS_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the static CRT setting on target code, away from host proc macros.
      - run: cargo clippy --workspace --all-targets --target $env:WINDOWS_TARGET --locked -- -D warnings
      - run: cargo test --workspace --target $env:WINDOWS_TARGET --locked
      - run: cargo build --workspace --release --target $env:WINDOWS_TARGET --locked
      - name: Setup ownership and recovery
        shell: powershell
        run: |
          ./scripts/validate-script-defaults.ps1
          ./scripts/validate-install-recovery.ps1 -ReportPath "$PWD/target/install-recovery-checks.json"
          ./scripts/validate-upgrade-snapshot.ps1 -ReportPath "$PWD/target/upgrade-snapshot-checks.json"
          ./scripts/validate-portable-install.ps1 -ReportPath "$PWD/target/portable-install-checks.json"
          ./scripts/validate-setup-state.ps1 -ReportPath "$PWD/target/setup-state-checks.json"
          ./scripts/validate-startup.ps1 -ReportPath "$PWD/target/startup-preference-checks.json"
          ./scripts/validate-install-shell.ps1 -ReportPath "$PWD/target/install-shell-checks.json"
          ./scripts/setup.ps1 -CompileOnly
      - name: Real window integration
        shell: pwsh
        run: ./scripts/integration.ps1 -BuildDirectory "$PWD/target/$env:WINDOWS_TARGET/release"
      - name: Pre-existing window workspace assignments
        shell: powershell
        run: ./scripts/integration.ps1 -BuildDirectory "$PWD/target/$env:WINDOWS_TARGET/release" -StartupAssignmentOnly -ReportPath "$PWD/target/startup-assignment-results.json"
      - name: Workspace carousel integration
        shell: powershell
        run: ./scripts/carousel-integration.ps1 -BuildDirectory "$PWD/target/$env:WINDOWS_TARGET/release" -ReportPath "$PWD/target/carousel-integration-results.json"
      - name: Build and exercise the Windows installer
        # Exercise the Arm64 launcher natively before the x64 release runner publishes it.
        if: github.event_name == 'pull_request' || matrix.arch == 'arm64'
        shell: powershell
        run: |
          cargo build --locked --release --target $env:WINDOWS_TARGET -p moon --features moon/uiaccess
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --target $env:WINDOWS_TARGET -p moon-win --example window_inventory --example recover_windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $build = "$PWD\target\$env:WINDOWS_TARGET\release"
          $inputs = @{
            Target = $env:WINDOWS_TARGET
            Version = (Get-Item "$build\moon.exe").VersionInfo.ProductVersion
            Binary = "$build\moon.exe"
            SettingsBinary = "$build\moon-settings.exe"
            InventoryBinary = "$build\examples\window_inventory.exe"
            RecoveryBinary = "$build\examples\recover_windows.exe"
          }
          $package = .\scripts\package.ps1 @inputs -OutputDirectory "$env:RUNNER_TEMP\moon-dist"
          .\scripts\validate-setup-exe.ps1 -InstallerPath $package.installer -ArchivePath $package.archive `
            -Version $package.version -Target $package.target -ReportPath "$PWD/target/setup-exe-checks.json"
          .\scripts\validate-package.ps1 @inputs -ReportPath "$PWD/target/package-checks.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-${{ matrix.arch }}-test-results
          retention-days: 7
          path: |
            target/integration-results.json
            target/startup-assignment-results.json
            target/carousel-integration-results.json
            target/integration-logs/
            target/install-recovery-checks.json
            target/upgrade-snapshot-checks.json
            target/portable-install-checks.json
            target/setup-state-checks.json
            target/startup-preference-checks.json
            target/install-shell-checks.json
            target/setup-exe-checks.json
            target/package-checks.json
          if-no-files-found: ignore
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parser: [config, protocol]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-11-10 --profile minimal
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - run: cargo +nightly-2026-11-10 fuzz run --fuzz-dir crates/moon-core/fuzz ${{ matrix.parser }} -- -max_total_time=30 -max_len=65536
      - name: Upload a failing fuzz input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.parser }}-artifacts
          path: crates/moon-core/fuzz/artifacts/${{ matrix.parser }}/
          retention-days: 7
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [settings, core, dependencies, windows, fuzz]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
