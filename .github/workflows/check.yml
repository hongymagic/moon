name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: apps/settings
      - run: bun run check && bun run build
        working-directory: apps/settings
      - run: git diff --exit-code -- apps/settings/dist
      - run: bunx playwright install --with-deps chromium --only-shell && bun run test
        working-directory: apps/settings
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generated reference matches the current schema
        run: |
          cargo run --locked -q -p moon -- config schema > docs/config.schema.json
          cargo run --locked -q -p moon -- config reference > docs/config-reference.md
          cargo run --locked -q -p moon -- protocol schema > docs/protocol.schema.json
          git diff --exit-code -- docs/config.schema.json docs/config-reference.md docs/protocol.schema.json
      - run: cargo bench -p moon-core --bench reducer --locked
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo install --locked cargo-audit --version 0.23.0
      - run: cargo deny check
      - run: cargo audit
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      # Keep the static CRT setting on target code, away from host proc macros.
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
      - run: cargo test --workspace --target x86_64-pc-windows-msvc --locked
      - run: cargo build --workspace --release --target x86_64-pc-windows-msvc --locked
      - name: Setup ownership and recovery
        shell: powershell
        run: |
          ./scripts/validate-install-recovery.ps1 -ReportPath "$PWD/target/install-recovery-checks.json"
          ./scripts/validate-upgrade-snapshot.ps1 -ReportPath "$PWD/target/upgrade-snapshot-checks.json"
          ./scripts/validate-portable-install.ps1 -ReportPath "$PWD/target/portable-install-checks.json"
          ./scripts/validate-setup-state.ps1 -ReportPath "$PWD/target/setup-state-checks.json"
          ./scripts/validate-install-shell.ps1 -ReportPath "$PWD/target/install-shell-checks.json"
      - name: Real window integration
        shell: pwsh
        run: ./scripts/integration.ps1 -BuildDirectory "$PWD/target/x86_64-pc-windows-msvc/release"
      - name: Pre-existing window workspace assignments
        shell: powershell
        run: ./scripts/integration.ps1 -BuildDirectory "$PWD/target/x86_64-pc-windows-msvc/release" -StartupAssignmentOnly -ReportPath "$PWD/target/startup-assignment-results.json"
      - name: Workspace carousel integration
        shell: powershell
        run: ./scripts/carousel-integration.ps1 -BuildDirectory "$PWD/target/x86_64-pc-windows-msvc/release" -ReportPath "$PWD/target/carousel-integration-results.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-build-and-evidence
          path: |
            target/x86_64-pc-windows-msvc/release/moon.exe
            target/x86_64-pc-windows-msvc/release/moon-settings.exe
            target/x86_64-pc-windows-msvc/release/testwin.exe
            target/integration-results.json
            target/startup-assignment-results.json
            target/carousel-integration-results.json
            target/integration-logs/
            target/install-recovery-checks.json
            target/setup-state-checks.json
            target/install-shell-checks.json
          if-no-files-found: error
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        parser: [config, protocol]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly-2026-11-10 --profile minimal
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - run: cargo +nightly-2026-11-10 fuzz run --fuzz-dir crates/moon-core/fuzz ${{ matrix.parser }} -- -max_total_time=30 -max_len=65536
