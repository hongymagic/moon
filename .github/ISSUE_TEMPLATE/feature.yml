name: Feature request
description: Describe something you would like to do with Moon.
body:
  - type: textarea
    id: task
    attributes:
      label: What would you like to do?
      description: Describe your workflow and where you get stuck today.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: How should Moon behave?
      description: Include an example or workaround if you have one.
